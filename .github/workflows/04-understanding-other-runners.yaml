name: "04 - Understanding Other Runners"

on: push

jobs:
  ubuntu-runner:
    runs-on: ubuntu-latest
    steps:
    - name: Print UbuntuRunner Info
      run: |
        echo "Workflow is triggered on github hosted runners"
        echo "Runner Name: $RUNNER_NAME"
        echo "Runner OS: $RUNNER_OS"
        echo "Runner Architecture: $RUNNER_ARCH"
  windows-runner:
    runs-on: windows-latest
    steps:
    - name: Print WindowsRunner Info
      run: |
        echo "Workflow is triggered on github hosted runners"
        echo "Runner Name: $RUNNER_NAME"
        echo "Runner OS: $RUNNER_OS"
        echo "Runner Architecture: $RUNNER_ARCH"
  macos-runner:
    runs-on: macos-latest
    steps:
    - name: Print MacOSRunner Info
      run: |
        echo "Workflow is triggered on github hosted runners"
        echo "Runner Name: $RUNNER_NAME"
        echo "Runner OS: $RUNNER_OS"
        echo "Runner Architecture: $RUNNER_ARCH"
